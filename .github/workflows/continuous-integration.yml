name: "Continuous Integration"

on:
  push:
  pull_request:

jobs:
  qa:
    uses: contenir/contenir-qa-tools/.github/workflows/continuous-integration.yml@0.1.x
    # By name: secrets: inherit doesn't cross from contenir-extension to contenir.
    secrets:
      AUTODEV_APP_PRIVATE_KEY: ${{ secrets.AUTODEV_APP_PRIVATE_KEY }}
    with:
      mago-version: "1.59.0"
      php-versions: '["8.3", "8.4", "8.5"]'
      run-integration: true
      enable-codecov: false
      enable-composer-audit: true
      enable-infection: true
      infection-diff-on-pull-requests: true
      min-msi: "80"
      min-covered-msi: "80"
      boot-cms: true
      # Extension API 0.8 is hosted only on the CMS's main until v2.1.0 is tagged
      boot-cms-ref: main
      boot-cms-pages: >-
        [
          "/admin/settings/common/index/category/seo/section/seo",
          "/admin/settings/common/index/category/seo/section/seo-verification",
          "/admin/settings/common/index/category/seo/section/seo-sitemap"
        ]

  js:
    name: "JavaScript"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run test:coverage

      - run: npm run build

      - name: "Check the committed build matches the sources"
        run: |
          git diff --exit-code -- public/
          test -z "$(git status --porcelain -- public/)"
